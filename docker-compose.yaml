services:
  cpf-neo4j:
    image: neo4j:2026.02.2-trixie
    container_name: cpf-store-neo4j
    networks:
      - cpf-net
    environment:
      NEO4J_dbms_usage__report_enabled: false
      NEO4J_AUTH: neo4j/neo4jneo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p neo4jneo4j 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  cpf-store:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpf-store
    networks:
      - cpf-net
    depends_on:
      cpf-neo4j:
        condition: service_healthy
    # healthcheck:
    #   timeout: 5s
    #   retries: 10
    #   test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:8080/health/ || exit 1"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NEO4J_URI: bolt://cpf-neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: neo4jneo4j
      STORE_URL: ${STORE_URL:?STORE_URL must be set (e.g. http://localhost:8081/api/v1/)}
      TRUSTED_PARTY_URL: http://cpf-nro-service:8020/api/v1/
    ports:
      - "8081:8080"

volumes:
  neo4j_data:

networks:
  cpf-net:
    name: cpf-net
    driver: bridge