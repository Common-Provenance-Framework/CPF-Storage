name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  HARBOR_REGISTRY: cerit.io
  HARBOR_PROJECT: commonprovenanceframework
  IMAGE_NAME: cpf-storage
  JAVA_VERSION: '25'
  CHART_NAME: cpf-store
  MANIFEST_NAME: cpf-storage-manifests

jobs:
  build-test:
    name: 1. Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: ./mvnw clean verify

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Test Results
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit

  docker-build:
    name: 2. Docker Build & Verify
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Cache Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-docker:
    name: 3. Publish to Harbor
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Cached Image to Harbor
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

  publish-gitops:
    name: 4. Publish Chart & Flux Manifests
    runs-on: ubuntu-latest
    needs: publish-docker
    if: github.event_name == 'push' && github.ref_name == 'main'
    concurrency:
      group: publish-gitops
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Package Helm Chart
        run: |
          install -d "$RUNNER_TEMP/chart"
          cp -R helm/. "$RUNNER_TEMP/chart/"
          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' helm/values.yaml values/qa.yaml > "$RUNNER_TEMP/chart/values.yaml"
          helm package "$RUNNER_TEMP/chart" --destination "$RUNNER_TEMP"

      - name: Push Helm Chart to Harbor
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "$DOCKERHUB_PASSWORD" | helm registry login "$HARBOR_REGISTRY" -u "$DOCKERHUB_USERNAME" --password-stdin
          helm push "$RUNNER_TEMP"/"$CHART_NAME"-*.tgz "oci://$HARBOR_REGISTRY/$HARBOR_PROJECT"

      - name: Push Flux Manifests to Harbor
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          install -d "$RUNNER_TEMP/manifests"
          cp flux/qa/*.yaml "$RUNNER_TEMP/manifests/"
          sed -i "s|__GIT_SHA__|$GITHUB_SHA|g" "$RUNNER_TEMP/manifests"/*.yaml
          if grep -rq '__GIT_SHA__' "$RUNNER_TEMP/manifests"; then
            echo "revision placeholder was not substituted" >&2
            exit 1
          fi
          flux push artifact "oci://$HARBOR_REGISTRY/$HARBOR_PROJECT/$MANIFEST_NAME:latest" \
            --path="$RUNNER_TEMP/manifests" \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="$GITHUB_SHA" \
            --creds "$DOCKERHUB_USERNAME:$DOCKERHUB_PASSWORD"