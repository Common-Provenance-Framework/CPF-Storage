name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  HARBOR_REGISTRY: cerit.io
  HARBOR_PROJECT: commonprovenanceframework
  IMAGE_NAME: cpf-storage
  JAVA_VERSION: '25'
  QA_NAMESPACE: cpf
  QA_RELEASE: cpf-storage

jobs:
  build-test:
    name: 1. Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: ./mvnw clean verify

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Test Results
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit

  docker-build:
    name: 2. Docker Build & Verify
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Cache Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-docker:
    name: 3. Publish to Harbor
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Cached Image to Harbor
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

  deploy-qa:
    name: 4. Deploy to QA
    runs-on: ubuntu-latest
    needs: publish-docker
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment: qa
    concurrency:
      group: deploy-qa
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBE_CONFIG_QA: ${{ secrets.KUBE_CONFIG_QA }}
        run: |
          if [ -z "$KUBE_CONFIG_QA" ]; then
            echo "secret KUBE_CONFIG_QA is not set" >&2
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/.kube"
          printf '%s' "$KUBE_CONFIG_QA" | base64 -d > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: |
          kubectl version -o yaml | grep -E 'gitVersion|serverVersion' || true
          kubectl get namespace "$QA_NAMESPACE"

      - name: Deploy Helm chart
        run: |
          helm upgrade --install "$QA_RELEASE" ./helm \
            --namespace "$QA_NAMESPACE" \
            --values values/qa.yaml \
            --set fullnameOverride=cpf-store \
            --set image.repository="$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME" \
            --set image.tag="${{ github.sha }}" \
            --set image.pullPolicy=IfNotPresent \
            --wait --atomic --timeout 10m

      - name: Show deployed workloads
        if: always()
        run: |
          helm status "$QA_RELEASE" --namespace "$QA_NAMESPACE" || true
          kubectl get deploy,pod,svc --namespace "$QA_NAMESPACE" \
            -l app.kubernetes.io/instance="$QA_RELEASE" || true

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/.kube/config"