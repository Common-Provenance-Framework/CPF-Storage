apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cpf-storage-manifests
  namespace: cozy-fluxcd
spec:
  interval: 2m
  url: oci://cerit.io/commonprovenanceframework/cpf-storage-manifests
  ref:
    tag: latest
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-storage
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: cpf-storage-manifests
